<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Media Forge">
  <title>Media Forge</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05030c"/>
      <stop offset="0.55" stop-color="#0f0922"/>
      <stop offset="1" stop-color="#1c103e"/>
    </linearGradient>
    <radialGradient id="blob-hue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6a3df0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#6a3df0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob-accent" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a4a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff8a4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a4a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff8a4a" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>
  <style>
    .t { font-family: 'Segoe UI Variable Display','Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,system-ui,sans-serif; fill: #ffffff; }
    .name { font-size: 68px; font-weight: 700; letter-spacing: -0.02em; }
    .tag { font-size: 25px; font-weight: 400; fill-opacity: 0.78; }
    .meta { font-size: 16px; font-weight: 600; fill-opacity: 0.5; letter-spacing: 0.12em; text-transform: uppercase; }
    .b1 { animation: drift1 26s ease-in-out infinite alternate; }
    .b2 { animation: drift2 31s ease-in-out infinite alternate; }
    @keyframes drift1 { from { transform: translate(0, 0); } to { transform: translate(90px, -40px); } }
    @keyframes drift2 { from { transform: translate(0, 0); } to { transform: translate(-110px, 50px); } }
    @media (prefers-reduced-motion: reduce) { .b1, .b2 { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="b1" cx="922" cy="72" r="312" fill="url(#blob-hue)"/>
      <circle class="b2" cx="384" cy="380" r="248" fill="url(#blob-accent)"/>
    </g>
    <rect x="112.0" y="120.0" width="160" height="160" rx="32" fill="url(#tile)" stroke="url(#rim)" stroke-width="1.5" filter="url(#shadow)"/>
    <svg x="136.0" y="144.0" width="112.0" height="112.0" viewBox="0 0 64 64" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="ic-s" x1="10" y1="20" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3cc4ff"/><stop offset=".5" stop-color="#4a7dff"/><stop offset="1" stop-color="#7457ff"/>
    </linearGradient>
    <linearGradient id="ic-t" x1="14" y1="10" x2="50" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9f3ff"/><stop offset="1" stop-color="#8fb6ff"/>
    </linearGradient>
  </defs>
  <path d="M32 7 54 19.5v25L32 57 10 44.5v-25Z" fill="url(#ic-s)"/>
  <path d="M32 7 54 19.5 32 32 10 19.5Z" fill="url(#ic-t)" opacity=".92"/>
  <path d="M32 32v25L10 44.5v-25Z" fill="#0b1a4a" opacity=".28"/>
  <path d="M32 7 54 19.5v25L32 57 10 44.5v-25Z" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M10 19.5 32 32l22-12.5M32 32v25" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M55 2.5l1.6 4.4 4.4 1.6-4.4 1.6-1.6 4.4-1.6-4.4-4.4-1.6 4.4-1.6Z" fill="#ffb37a"/>
</svg>
    <text class="t name" x="320.0" y="190.0">Media Forge</text>
    <rect x="320.0" y="204.0" width="200" height="3" rx="1.5" fill="url(#line)"/>
    <text class="t tag" x="320.0" y="241.0">Compress, upscale and convert video, photos and audio</text>
    <text class="t meta" x="320.0" y="279.0">Windows 10 / 11 · Portable · Open source</text>
  </g>
</svg>
