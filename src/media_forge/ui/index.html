<!doctype html>
<html lang="en" data-theme="nova">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Forge</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <!-- The saved theme before the first paint (js/main.js writes the key on every confirmed settings object). -->
  <script>try{var t=localStorage.getItem('media-forge.theme');if(['dusk','nova','frost','bloom'].indexOf(t)>=0)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <!-- Liquid UI design kit: a vendored copy (vendor/liquid_ui/VENDORED.txt); fonts are named in its tokens.css only. -->
  <link rel="stylesheet" href="vendor/liquid_ui/css/tokens.css">
  <link rel="stylesheet" href="vendor/liquid_ui/css/themes.css">
  <link rel="stylesheet" href="vendor/liquid_ui/css/base.css">
  <link rel="stylesheet" href="vendor/liquid_ui/css/scene.css">
  <link rel="stylesheet" href="vendor/liquid_ui/css/glass.css">
  <link rel="stylesheet" href="vendor/liquid_ui/css/components.css">
  <link rel="stylesheet" href="vendor/liquid_ui/css/titlebar.css">
  <!-- Media Forge screen. -->
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Scene behind everything (js/background.js). -->
  <div id="scene" aria-hidden="true"></div>

  <!-- SVG filters of the lenses (js/glass.js appends one <filter> per surface). -->
  <svg id="lg-defs" aria-hidden="true" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden"><defs></defs></svg>

  <div id="app">
    <!-- The list scrolls under the title bar and the footer; soft scroll edges sit on top of it. -->
    <main id="list-scroll" class="list-scroll">
      <div id="caps-banner" class="caps-banner glass-lite" role="status" hidden></div>
      <div id="list" class="list" role="list" aria-label="Files"></div>
      <section id="empty" class="empty" hidden>
        <div class="empty-card">
          <div class="empty-art" aria-hidden="true">
            <span class="ea ea-video"><i></i></span>
            <span class="ea ea-image"><i></i></span>
            <span class="ea ea-audio"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
          </div>
          <h1 class="empty-title">Drop video, photo or audio files</h1>
          <p class="empty-sub">Compress, upscale or convert them. Each file keeps its own settings.</p>
          <button type="button" id="btn-choose" class="btn btn-tinted btn-l" aria-keyshortcuts="Control+O"></button>
          <p class="empty-keys"><kbd>Ctrl</kbd> <kbd>O</kbd> to choose · drop anywhere in the window</p>
          <p class="empty-formats">MP4 · MOV · MKV · WebM · JPEG · PNG · HEIC · WebP · MP3 · WAV · FLAC and more</p>
        </div>
      </section>
    </main>
    <div class="edge edge-top" aria-hidden="true"></div>
    <div class="edge edge-bottom" aria-hidden="true"></div>

    <!-- The kit's title bar (js/main.js mountTitlebar): glyph, name and version pill; settings | minimize, close. -->
    <header id="titlebar"></header>

    <footer id="foot" class="foot" hidden>
      <div id="foot-stats" class="foot-stats"></div>
      <button type="button" id="btn-start" class="hero" data-state="empty" aria-keyshortcuts="Control+Enter"></button>
    </footer>
  </div>

  <!-- Overlays grow out of the control that opened them (js/overlay.js). -->
  <div id="update-pop" class="popover" role="dialog" aria-label="Media Forge updates"><div class="ov-content"></div></div>
  <div id="settings-sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title"><div class="ov-content"></div></div>

  <div id="veil" class="veil" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
